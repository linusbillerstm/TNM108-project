<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMDb Chatbot</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-top">
            <button class="new-chat-btn" onclick="location.reload()">
                <span>+</span> New Chat
            </button>
            <div class="history-list">
                <div class="history-item">IMDb Assistant</div>
            </div>
        </div>
        
        <div class="sidebar-bottom">
            <button id="openLoginBtn" class="login-btn">
                Log In
            </button>
        </div>
    </div>

    <div class="main-chat">
        <div class="chat-container" id="chatContainer">
    <div class="message ai">
        <div class="message-content" id="welcome-msg">
            Hej! Logga in för att spara serier, eller fråga direkt.
        </div>
    </div>
</div>

        <div class="input-area">
            <div class="input-box">
                <textarea id="userInput" placeholder="Beskriv en serie..." rows="1" oninput="autoResize(this)"></textarea>
                <select id="modelSelect" class="model-selector">
                    <option value="gemini">Gemini (LLM)</option>
                    <option value="tfidf">TF-IDF (Keyword)</option>
                    <option value="nomic">Nomic (Vector)</option>
                </select>
                <button id="send-btn" onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>

<div id="loginModal" class="modal">
    <div class="modal-content">
        <span class="close">&times;</span>
        
        <h2>Welcome Back</h2>
        <form id="loginForm">
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit" class="submit-btn">Log In</button>
        </form>
        <p>Don't have an account? <a href="#" id="switchToRegister">Sign up here</a></p>
    </div>
</div>

    <div id="registerModal" class="modal" style="display:none;">
    <div class="modal-content">
        <span class="close">&times;</span>
        
        <h2>Create Account</h2>
        <form id="registerForm">
            <input type="text" name="username" placeholder="Choose Username" required>
            <input type="password" name="password" placeholder="Choose Password" required>
            <button type="submit" class="submit-btn">Sign Up</button>
        </form>
        <p>Already have an account? <a href="#" id="switchToLogin">Log in here</a></p>
    </div>
</div>

    <script src="script.js"></script>
</body>
</html>
