<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMDb Chatbot</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-top">
            <button class="new-chat-btn" onclick="location.reload()">
                <span>+</span> New Chat
            </button>
            <div class="history-list">
                <div class="history-item">IMDb Assistant</div>
            </div>
        </div>
        
        <div class="sidebar-bottom">
            <button id="openLoginBtn" class="login-btn">
                Log In
            </button>
        </div>
    </div>

    <div class="main-chat">
        <div class="chat-container" id="chatContainer">
            <div class="message ai">
                <div class="message-content" id="welcome-msg">
                    Hej! Vad letar du efter för serie idag?
                </div>
            </div>
        </div>

        <div class="input-area">
            <div class="input-box">
                <textarea id="userInput" placeholder="Beskriv en serie..." rows="1" oninput="autoResize(this)"></textarea>
                
                <select id="modelSelect" class="model-selector">
                    <option value="tfidf">TF-IDF (Nyckelord)</option>
                    <option value="nomic">Nomic (Vector)</option>
                    <option value="hybrid">Hybrid (Best of both)</option>
                    <option value="gemini">Gemini (LLM)</option>
                </select>
                
                <button id="send-btn" onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>

    <template id="card-template">
        <div class="rec-card">
            <div class="score-badge"></div>
        
            <div class="rec-content">
                <div class="rec-text">
                    <h3 class="rec-title">
                        <span class="title-text"></span> 
                        <span class="year-text"></span>
                    </h3>
                    <p class="rec-reason"></p>
                </div>
            </div>
        </div>
    </template>

    <script src="script.js"></script>
</body>
</html>
